name: Publish Ravi portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare reviewed portfolio
        run: |
          mkdir -p _site/assets
          cp index.html style.css app.js alerts.js favicon.svg .nojekyll LEIA-ME.txt _site/
          unzip -q assets.zip -d _site/assets
          test -s _site/assets/vamp-abertura.mp4
          test -s _site/assets/alert-preview/renderer.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
